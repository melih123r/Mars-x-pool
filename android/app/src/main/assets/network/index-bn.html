<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARS-X Network — ডেমো তথ্য</title><style>body{background:#0d121a;color:#edf4fb;font:16px/1.65 system-ui;margin:0;padding:24px;max-width:760px}h1,h2{color:#ff9d3c}</style></head><body><h1>MARS-X Network</h1><h2>ডেমো তথ্য</h2><p>এই অ্যাপটি ডেমো সংস্করণ। প্রকৃত ইন্টারনেট ট্রাফিক শেয়ারিং, আয় ও অর্থপ্রদান বন্ধ রয়েছে।</p><p>ভবিষ্যতে নেটওয়ার্ক শেয়ার করতে প্রত্যাহারযোগ্য স্পষ্ট সম্মতি এবং অংশীদারের লিখিত অনুমতি প্রয়োজন।</p><p>DEMO · MARS-X Network</p></body></html>
