<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARS-X Network — डेमो जानकारी</title><style>body{background:#0d121a;color:#edf4fb;font:16px/1.65 system-ui;margin:0;padding:24px;max-width:760px}h1,h2{color:#ff9d3c}</style></head><body><h1>MARS-X Network</h1><h2>डेमो जानकारी</h2><p>यह ऐप केवल डेमो है। वास्तविक इंटरनेट ट्रैफ़िक साझा करना, कमाई और भुगतान बंद हैं।</p><p>भविष्य में नेटवर्क साझा करने के लिए वापस ली जा सकने वाली स्पष्ट सहमति और भागीदार की लिखित अनुमति आवश्यक होगी।</p><p>DEMO · MARS-X Network</p></body></html>
