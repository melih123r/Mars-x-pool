plugins { id "com.android.application" }

def qonversionProjectKey = providers.gradleProperty("QONVERSION_PROJECT_KEY")
        .orElse(providers.environmentVariable("QONVERSION_PROJECT_KEY"))
        .getOrElse("")
def escapedQonversionProjectKey = qonversionProjectKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.marsx.pool"
    compileSdk 36

    defaultConfig {
        applicationId "com.marsx.pool"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "0.6-beta"
        buildConfigField "String", "QONVERSION_PROJECT_KEY", "\"${escapedQonversionProjectKey}\""
        buildConfigField "String", "QONVERSION_PRODUCT_PRO", "\"pro_monthly\""
        buildConfigField "String", "QONVERSION_PRODUCT_FARM", "\"farm_monthly\""
    }

    buildFeatures { buildConfig true }

    // AGP normalizes Indonesian inconsistently between the modern `id` locale
    // and the legacy Java/Android `in` code. Translation parity is enforced by
    // scripts/check-translations.py instead of this noisy lint rule.
    lint { disable "MissingTranslation" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "io.qonversion.android.sdk:sdk:9.7.0"
}
