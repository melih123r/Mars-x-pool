plugins { id "com.android.application" }

def qonversionProjectKey = providers.gradleProperty("QONVERSION_PROJECT_KEY")
        .orElse(providers.environmentVariable("QONVERSION_PROJECT_KEY"))
        .getOrElse("")
def escapedQonversionProjectKey = qonversionProjectKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
def marsxApiBaseUrl = providers.gradleProperty("MARSX_API_BASE_URL")
        .orElse(providers.environmentVariable("MARSX_API_BASE_URL"))
        .getOrElse("https://gcqcxiqhuzfudlfosqlp.supabase.co/functions/v1/marsx-pool-api")
def escapedMarsxApiBaseUrl = marsxApiBaseUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
// The OAuth WEB client ID is public (not a secret) and must be present in
// debug APKs too, otherwise the modern Network-only login cannot work.
def googleWebClientId = providers.gradleProperty("GOOGLE_WEB_CLIENT_ID")
        .orElse(providers.environmentVariable("GOOGLE_WEB_CLIENT_ID"))
        .getOrElse("391717958124-uvhj6atdg2am2vq41fhu1iq76to19qme.apps.googleusercontent.com")
def escapedGoogleWebClientId = googleWebClientId
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def marsxVrscPoolAddress = providers.gradleProperty("MARSX_VRSC_POOL_ADDRESS")
        .orElse(providers.environmentVariable("MARSX_VRSC_POOL_ADDRESS"))
        .getOrElse("RFnoU1UFxBqrJh3NWUUBRBKCNGSEgkQ5c7")
def escapedMarsxVrscPoolAddress = marsxVrscPoolAddress
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.marsx.pool"
    compileSdk 36

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.marsx.pool"
        buildConfigField "boolean", "PRIVATE_PHONE", "false"
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName "0.9.4-network-pilot"
        buildConfigField "String", "QONVERSION_PROJECT_KEY", "\"${escapedQonversionProjectKey}\""
        buildConfigField "String", "QONVERSION_PRODUCT_PRO", "\"pro_monthly\""
        buildConfigField "String", "QONVERSION_PRODUCT_FARM", "\"farm_monthly\""
        buildConfigField "String", "MARSX_API_BASE_URL", "\"${escapedMarsxApiBaseUrl}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${escapedGoogleWebClientId}\""
        buildConfigField "String", "MARSX_VRSC_POOL_ADDRESS", "\"${escapedMarsxVrscPoolAddress}\""
        // Both debug and release DEMO builds use Google's non-monetizing test banner.
        buildConfigField "String", "DEMO_BANNER_UNIT", '"ca-app-pub-3940256099942544/6300978111"'
    }

    // The in-app picker must work offline for every supported language after Play install.
    bundle { language { enableSplit = false } }

    // Instrument only the private variant when explicitly requested by the device job.
    testBuildType = providers.gradleProperty("marsxTestBuildType").getOrElse("debug")

    buildFeatures { buildConfig true }

    // AGP normalizes Indonesian inconsistently between the modern `id` locale
    // and the legacy Java/Android `in` code. Translation parity is enforced by
    // scripts/check-translations.py instead of this noisy lint rule.
    lint { disable "MissingTranslation" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def releaseStoreFile = providers.environmentVariable("MARSX_UPLOAD_KEYSTORE_PATH").orElse("").get()
    def releaseStorePassword = providers.environmentVariable("MARSX_UPLOAD_STORE_PASSWORD").orElse("").get()
    def releaseKeyAlias = providers.environmentVariable("MARSX_UPLOAD_KEY_ALIAS").orElse("").get()
    def releaseKeyPassword = providers.environmentVariable("MARSX_UPLOAD_KEY_PASSWORD").orElse("").get()
    def hasUploadSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { !it.isEmpty() }
    signingConfigs {
        uploadRelease {
            if (hasUploadSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    sourceSets {
        debug.java.srcDir "src/publicNetwork/java"
        release.java.srcDir "src/publicNetwork/java"
    }
    buildTypes {
        privatePilot {
            initWith debug
            versionNameSuffix "-private"
            matchingFallbacks = ["debug"]
            buildConfigField "boolean", "PRIVATE_PHONE", "true"
        }
        release {
            if (hasUploadSigning) signingConfig signingConfigs.uploadRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Only the USB-provisioned phone build links the reviewed, pinned v1.3.2 AAR.
    privatePilotImplementation files("libs/proxies-sdk-v132-patched-debug.aar")
    privatePilotImplementation("androidx.core:core-ktx:1.12.0")
    privatePilotImplementation("androidx.appcompat:appcompat:1.6.1")
    privatePilotImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    privatePilotImplementation("androidx.security:security-crypto:1.1.0-alpha06")
    privatePilotImplementation("com.squareup.okhttp3:okhttp:4.12.0")
    privatePilotImplementation("com.google.code.gson:gson:2.10.1")
    privatePilotImplementation("org.nanohttpd:nanohttpd:2.3.1")
    privatePilotImplementation("androidx.work:work-runtime-ktx:2.9.0")
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation "io.qonversion.android.sdk:sdk:9.7.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
