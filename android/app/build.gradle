plugins { id "com.android.application" }

def qonversionProjectKey = providers.gradleProperty("QONVERSION_PROJECT_KEY")
        .orElse(providers.environmentVariable("QONVERSION_PROJECT_KEY"))
        .getOrElse("")
def escapedQonversionProjectKey = qonversionProjectKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
def marsxApiBaseUrl = providers.gradleProperty("MARSX_API_BASE_URL")
        .orElse(providers.environmentVariable("MARSX_API_BASE_URL"))
        .getOrElse("https://gcqcxiqhuzfudlfosqlp.supabase.co/functions/v1/marsx-pool-api")
def escapedMarsxApiBaseUrl = marsxApiBaseUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
def googleWebClientId = providers.gradleProperty("GOOGLE_WEB_CLIENT_ID")
        .orElse(providers.environmentVariable("GOOGLE_WEB_CLIENT_ID"))
        .getOrElse("")
def escapedGoogleWebClientId = googleWebClientId
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def marsxVrscPoolAddress = providers.gradleProperty("MARSX_VRSC_POOL_ADDRESS")
        .orElse(providers.environmentVariable("MARSX_VRSC_POOL_ADDRESS"))
        .getOrElse("RFnoU1UFxBqrJh3NWUUBRBKCNGSEgkQ5c7")
def escapedMarsxVrscPoolAddress = marsxVrscPoolAddress
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.marsx.pool"
    compileSdk 36

    defaultConfig {
        applicationId "com.marsx.pool"
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName "0.9.4-network-demo"
        buildConfigField "String", "QONVERSION_PROJECT_KEY", "\"${escapedQonversionProjectKey}\""
        buildConfigField "String", "QONVERSION_PRODUCT_PRO", "\"pro_monthly\""
        buildConfigField "String", "QONVERSION_PRODUCT_FARM", "\"farm_monthly\""
        buildConfigField "String", "MARSX_API_BASE_URL", "\"${escapedMarsxApiBaseUrl}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${escapedGoogleWebClientId}\""
        buildConfigField "String", "MARSX_VRSC_POOL_ADDRESS", "\"${escapedMarsxVrscPoolAddress}\""
        // Both debug and release DEMO builds use Google's non-monetizing test banner.
        buildConfigField "String", "DEMO_BANNER_UNIT", '"ca-app-pub-3940256099942544/6300978111"'
    }

    // The in-app picker must work offline for every supported language after Play install.
    bundle { language { enableSplit = false } }

    buildFeatures { buildConfig true }

    // AGP normalizes Indonesian inconsistently between the modern `id` locale
    // and the legacy Java/Android `in` code. Translation parity is enforced by
    // scripts/check-translations.py instead of this noisy lint rule.
    lint { disable "MissingTranslation" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def releaseStoreFile = providers.environmentVariable("MARSX_UPLOAD_KEYSTORE_PATH").orElse("").get()
    def releaseStorePassword = providers.environmentVariable("MARSX_UPLOAD_STORE_PASSWORD").orElse("").get()
    def releaseKeyAlias = providers.environmentVariable("MARSX_UPLOAD_KEY_ALIAS").orElse("").get()
    def releaseKeyPassword = providers.environmentVariable("MARSX_UPLOAD_KEY_PASSWORD").orElse("").get()
    def hasUploadSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { !it.isEmpty() }
    signingConfigs {
        uploadRelease {
            if (hasUploadSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.uploadRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation "io.qonversion.android.sdk:sdk:9.7.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
