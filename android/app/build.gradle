plugins { id "com.android.application" }

def qonversionProjectKey = providers.gradleProperty("QONVERSION_PROJECT_KEY")
        .orElse(providers.environmentVariable("QONVERSION_PROJECT_KEY"))
        .getOrElse("")
def escapedQonversionProjectKey = qonversionProjectKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
def marsxApiBaseUrl = providers.gradleProperty("MARSX_API_BASE_URL")
        .orElse(providers.environmentVariable("MARSX_API_BASE_URL"))
        .getOrElse("https://gcqcxiqhuzfudlfosqlp.supabase.co/functions/v1/marsx-pool-api")
def escapedMarsxApiBaseUrl = marsxApiBaseUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
def googleWebClientId = providers.gradleProperty("GOOGLE_WEB_CLIENT_ID")
        .orElse(providers.environmentVariable("GOOGLE_WEB_CLIENT_ID"))
        .getOrElse("")
def escapedGoogleWebClientId = googleWebClientId
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.marsx.pool"
    compileSdk 36

    defaultConfig {
        applicationId "com.marsx.pool"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "0.8.4-beta"
        buildConfigField "String", "QONVERSION_PROJECT_KEY", "\"${escapedQonversionProjectKey}\""
        buildConfigField "String", "QONVERSION_PRODUCT_PRO", "\"pro_monthly\""
        buildConfigField "String", "QONVERSION_PRODUCT_FARM", "\"farm_monthly\""
        buildConfigField "String", "MARSX_API_BASE_URL", "\"${escapedMarsxApiBaseUrl}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${escapedGoogleWebClientId}\""
    }

    buildFeatures { buildConfig true }

    // AGP normalizes Indonesian inconsistently between the modern `id` locale
    // and the legacy Java/Android `in` code. Translation parity is enforced by
    // scripts/check-translations.py instead of this noisy lint rule.
    lint { disable "MissingTranslation" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation "io.qonversion.android.sdk:sdk:9.7.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}

// Embed the same immutable fee policy served by the backend.
def feeAssetsDir = layout.buildDirectory.dir("generated/commission-assets")
tasks.register("syncCommissionPolicy", Copy) {
    from rootProject.file("../pool/commission-policy.json")
    into feeAssetsDir
}
android.sourceSets.main.assets.srcDir(feeAssetsDir)
tasks.named("preBuild").configure { dependsOn("syncCommissionPolicy") }
