name: Finance Android CI
on:
  push:
    branches: [finance-open-source-integration-20261012]
    paths:
      - 'marsx-finance/android/**'
      - 'marsx-finance/exchange-ui/**'
      - '.github/workflows/finance-android-ci.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'marsx-finance/android/**'
      - 'marsx-finance/exchange-ui/**'
      - '.github/workflows/finance-android-ci.yml'
jobs:
  unified-finance-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Build unified MARS-X Finance APK
        working-directory: marsx-finance/exchange-ui
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode summary
      - name: Verify unified APK exists
        run: test -s marsx-finance/exchange-ui/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MARS-X-Finance-unified-debug-APK
          path: marsx-finance/exchange-ui/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
