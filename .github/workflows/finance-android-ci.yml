name: Finance Android CI
on:
  push:
    branches: [finance-open-source-integration-20261012]
    paths:
      - 'marsx-finance/android/**'
      - 'marsx-finance/exchange-ui/**'
      - '.github/workflows/finance-android-ci.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'marsx-finance/android/**'
      - 'marsx-finance/exchange-ui/**'
      - '.github/workflows/finance-android-ci.yml'
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Finance debug APK
        working-directory: marsx-finance/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-finance-debug-apk
          path: marsx-finance/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  exchange-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Exchange demo APK
        working-directory: marsx-finance/exchange-ui
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-exchange-demo-debug-apk
          path: marsx-finance/exchange-ui/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
