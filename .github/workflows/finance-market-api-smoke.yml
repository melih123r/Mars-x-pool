name: Finance Market Data API Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/market_api_smoke.py'
      - '.github/workflows/finance-market-api-smoke.yml'
jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public OHLCV APIs (read-only)
        run: python scripts/market_api_smoke.py
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-market-api-smoke-report
          path: reports/market-api-smoke.md
          if-no-files-found: warn
