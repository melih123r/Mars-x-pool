name: Network Android debug build
on:
  pull_request:
    paths:
      - 'network-android/**'
      - '.github/workflows/network-android-build.yml'
  push:
    branches: [feature/network-consent-simulator-20261015]
    paths:
      - 'network-android/**'
      - '.github/workflows/network-android-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: network-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble offline demo
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-network-offline-debug
          path: network-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
