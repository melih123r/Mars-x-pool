name: Network ledger integration

on:
  push:
    branches:
      - bot1/network-ledger-reservation-20261020
  pull_request:
    paths:
      - 'network/db/**'
      - 'network/src/wallet/**'
      - '.github/workflows/network-ledger-integration.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marsx
          POSTGRES_PASSWORD: marsx_test
          POSTGRES_DB: marsx_network_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marsx -d marsx_network_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETWORK_LEDGER_DATABASE_URL: postgresql://marsx:marsx_test@127.0.0.1:5432/marsx_network_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Network reservation integration
        run: node --test network/src/wallet/payout-reservation.integration.test.mjs
