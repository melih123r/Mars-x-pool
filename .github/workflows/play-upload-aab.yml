name: Play upload signed AAB
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate upload signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MARSX_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MARSX_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARSX_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARSX_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing MARSX_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "::error::Missing MARSX_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing MARSX_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::Missing MARSX_UPLOAD_KEY_PASSWORD"; exit 1; }
      - name: Install Android API 36 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode private upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARSX_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marsx-upload.jks"
          test -s "$RUNNER_TEMP/marsx-upload.jks"
      - name: Build signed release bundle
        env:
          MARSX_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/marsx-upload.jks
          MARSX_UPLOAD_STORE_PASSWORD: ${{ secrets.MARSX_UPLOAD_STORE_PASSWORD }}
          MARSX_UPLOAD_KEY_ALIAS: ${{ secrets.MARSX_UPLOAD_KEY_ALIAS }}
          MARSX_UPLOAD_KEY_PASSWORD: ${{ secrets.MARSX_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android :app:bundleRelease --no-daemon
      - name: Verify bundle signature
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -q 'Owner:'
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-network-play-upload-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Delete local keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/marsx-upload.jks"
