name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run cf:check
      - run: npm run cf:db:local
      - run: if [ -f scripts/check-translations.py ]; then python3 scripts/check-translations.py; fi
      - run: if [ -f scripts/check-release.py ]; then python3 scripts/check-release.py; fi

