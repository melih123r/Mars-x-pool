name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Network-only release: do not execute unrelated Telegram/Finance suites.
    if: github.ref_name != 'release/network-demo-signed-aab-20261022' && github.head_ref != 'release/network-demo-signed-aab-20261022' && github.ref_name != 'prep/traffmonetizer-adapter-20261024' && github.head_ref != 'prep/traffmonetizer-adapter-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run cf:check
      - run: npm run cf:db:local
      - run: python3 scripts/check-translations.py
      - run: python3 scripts/check-release.py
      - name: Network Android UI safety contract
        run: python3 scripts/check-network-home-ui.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android API 36 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon
      - name: Android release lint
        run: gradle -p android :app:lintRelease --no-daemon
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Publish debug APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: marsx-network-v18-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build release AAB
        run: gradle -p android :app:bundleRelease --no-daemon
      - name: Verify merged Network DEMO manifest
        run: python3 scripts/check-demo-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-network-v18-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
