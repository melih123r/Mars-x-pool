name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Network-only release: do not execute unrelated Telegram/Finance suites.
    if: github.ref_name != 'release/network-demo-signed-aab-20261022' && github.head_ref != 'release/network-demo-signed-aab-20261022' && github.ref_name != 'fix/network-language-delivery-20261024' && github.head_ref != 'fix/network-language-delivery-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run cf:check
      - run: npm run cf:db:local
      - run: python3 scripts/check-translations.py
      - run: python3 scripts/check-release.py
      - name: Network Android UI safety contract
        run: python3 scripts/check-network-home-ui.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android API 36 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Network locale and DEMO safety checks
        run: python3 scripts/check-network-home-ui.py
      - name: Android unit tests
        run: |
          for attempt in 1 2 3; do
            gradle -p android :app:testDebugUnitTest --no-daemon && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Android release lint
        run: |
          for attempt in 1 2 3; do
            if gradle -p android :app:lintRelease --no-daemon; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            if gradle -p android :app:assembleDebug --no-daemon; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Publish debug APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: marsx-network-v19-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check production AdMob configuration
        env:
          MARSX_ADMOB_BANNER_UNIT: ${{ secrets.MARSX_ADMOB_BANNER_UNIT }}
          MARSX_ADMOB_INTERSTITIAL_UNIT: ${{ secrets.MARSX_ADMOB_INTERSTITIAL_UNIT }}
        run: |
          if [ -z "$MARSX_ADMOB_INTERSTITIAL_UNIT" ]; then
            echo "::warning::MARSX_ADMOB_INTERSTITIAL_UNIT is not configured. Release will not show full-screen ads."
          elif [[ ! "$MARSX_ADMOB_INTERSTITIAL_UNIT" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]]; then
            echo "::error::MARSX_ADMOB_INTERSTITIAL_UNIT has an invalid format."
            exit 1
          fi
          if [ -z "$MARSX_ADMOB_BANNER_UNIT" ]; then
            echo "::warning::MARSX_ADMOB_BANNER_UNIT is not configured. Release AAB will not request live banner ads."
          elif [[ ! "$MARSX_ADMOB_BANNER_UNIT" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]]; then
            echo "::error::MARSX_ADMOB_BANNER_UNIT has an invalid format."
            exit 1
          else
            echo "Production AdMob banner unit format verified (value kept secret)."
          fi
      - name: Build release AAB
        env:
          MARSX_ADMOB_BANNER_UNIT: ${{ secrets.MARSX_ADMOB_BANNER_UNIT }}
        run: |
          for attempt in 1 2 3; do
            if gradle -p android :app:bundleRelease --no-daemon; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Verify all-language AAB packaging
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle=android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-config.json"
          python3 - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          config=json.loads((Path(os.environ['RUNNER_TEMP'])/'bundle-config.json').read_text())
          dimensions=config['optimizations']['splitsConfig']['splitDimension']
          assert any(d.get('value')=='LANGUAGE' and d.get('negate') is True for d in dimensions), dimensions
          print('PASS: built AAB disables language splits; picker resources ship together')
          PYCONFIG
      - name: Verify merged Network DEMO manifest
        run: python3 scripts/check-demo-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-network-v19-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
