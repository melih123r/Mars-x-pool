name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:cloudflare
      - run: npm test
      - run: npx wrangler d1 migrations apply DB --local
      - run: python3 scripts/check-translations.py
      - run: python3 scripts/check-release.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android API 36 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle -p android :app:lintRelease :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-pool-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-pool-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
