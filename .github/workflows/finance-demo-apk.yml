name: Finance Demo APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/finance-demo-apk.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1); fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Validate version and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 19' android/app/build.gradle
          grep -q 'versionName "0.9.6-beta-demo"' android/app/build.gradle
          test -s android/app/src/main/res/drawable/ic_launcher.xml
      - name: Build and test debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and size
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          test "$BYTES" -le 1073741824
          sha256sum "$APK"
          echo "APK_BYTES=$BYTES" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: MARS-X-Finance-0.9.6-beta-demo-debug-APK-run-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
