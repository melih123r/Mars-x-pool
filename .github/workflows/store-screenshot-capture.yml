name: Capture Play Store screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/store-screenshot-capture.yml
      - scripts/capture-store-screenshots.sh

permissions:
  contents: read

concurrency:
  group: store-screenshot-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator and capture real app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/capture-store-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-pool-0.8.4-store-screenshots
          path: store-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
