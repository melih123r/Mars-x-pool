name: MARS-X Finance UI Preview
on:
  push:
    branches: [marsx-finance-ui-first-ci, marsx-global-engine-v01]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager missing from Android SDK"; exit 1; fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate UI translations
        run: python3 scripts/check-translations.py
      - name: Compile, test and build APK
        run: bash scripts/build-android.sh :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marsx-finance-ui-preview
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
