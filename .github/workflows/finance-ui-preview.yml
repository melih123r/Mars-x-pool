name: MARS-X Finance UI Preview
on:
  push:
    branches: [marsx-finance-ui-first-ci, marsx-global-engine-v01]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate UI translations
        run: python3 scripts/check-translations.py
      - name: Compile Android UI and unit tests
        run: bash scripts/build-android.sh :app:testDebugUnitTest
      - name: Build UI preview APK
        run: bash scripts/build-android.sh :app:assembleDebug
      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marsx-finance-ui-preview
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
