name: Finance Market Gateway CI
on:
  push:
    paths:
      - 'marsx-finance/market-gateway/**'
      - '.github/workflows/finance-market-gateway-ci.yml'
  pull_request:
    paths:
      - 'marsx-finance/market-gateway/**'
      - '.github/workflows/finance-market-gateway-ci.yml'
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        working-directory: marsx-finance/market-gateway
        run: python -m compileall -q .
      - name: Run offline gateway tests
        working-directory: marsx-finance/market-gateway
        run: python -m unittest discover -v
