name: Network DEMO signed AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Require existing upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.MARSX_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MARSX_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARSX_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARSX_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "BLOCKED: existing upload key secrets are missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marsx-upload.jks"
          chmod 600 "$RUNNER_TEMP/marsx-upload.jks"
      - name: Test lint and build signed AAB
        env:
          MARSX_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/marsx-upload.jks
          MARSX_UPLOAD_STORE_PASSWORD: ${{ secrets.MARSX_UPLOAD_STORE_PASSWORD }}
          MARSX_UPLOAD_KEY_ALIAS: ${{ secrets.MARSX_UPLOAD_KEY_ALIAS }}
          MARSX_UPLOAD_KEY_PASSWORD: ${{ secrets.MARSX_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle -p android :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --no-daemon
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB" > "$RUNNER_TEMP/signing-report.txt"
          sha256sum "$AAB" | tee "$RUNNER_TEMP/aab-sha256.txt"
          wc -c < "$AAB" | tee "$RUNNER_TEMP/aab-bytes.txt"
      - name: Upload signed bundle and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: marsx-network-demo-signed-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/aab-sha256.txt
            ${{ runner.temp }}/aab-bytes.txt
            ${{ runner.temp }}/signing-report.txt
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/marsx-upload.jks"
