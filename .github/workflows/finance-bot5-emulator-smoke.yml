name: Finance Bot 5 emulator smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/finance-emulator-smoke.sh'
      - '.github/workflows/finance-bot5-emulator-smoke.yml'
permissions:
  contents: read
# Cancel superseded emulator builds for the same pull request/branch.
concurrency:
  group: finance-bot5-emulator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: bash scripts/build-android.sh :app:assembleDebug --stacktrace
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache a clean API 26 AVD so subsequent runs can boot from a snapshot.
      - name: Cache Android 8 AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: finance-api26-x86-pixel2-4gb-avd-v1
      - name: Generate clean Android 8 snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo 'Clean API 26 snapshot generated'
      - name: Boot and launch with 4 GB RAM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/finance-emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-bot5-api26-4gb-smoke
          path: qa-evidence/
          retention-days: 14
          if-no-files-found: error
