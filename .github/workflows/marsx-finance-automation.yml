name: MARS-X Finance Automation Engine
on:
  push:
    branches: [marsx-global-engine-v01]
    paths:
      - 'android/**'
      - 'global-engine/**'
      - 'test/**'
      - 'finance-ui/**'
      - 'package.json'
      - '.github/workflows/marsx-finance-automation.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'global-engine/**'
      - 'test/**'
      - 'finance-ui/**'
      - 'package.json'
  workflow_dispatch:
  # GitHub runs schedules ONLY from the default branch.
  # This cron becomes active after this workflow is merged into default.
  schedule:
    - cron: '2/5 * * * *'
permissions:
  contents: read
concurrency:
  group: marsx-finance-auto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finance-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Finance source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/finance/REFERENCE_PLUS_ONE.md
          test -f android/app/src/main/java/com/marsx/pool/FinanceActivity.java
          test -f android/app/src/main/AndroidManifest.xml
          echo "Finance source files present at ${GITHUB_SHA}"
      - name: Set up Node
        if: github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing Node test suite
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run global-engine:test
      - name: Set up Java
        if: github.event_name != 'schedule'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        if: github.event_name != 'schedule'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
        with:
          gradle-version: '8.11.1'
      - name: Android debug build
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload verified debug APK
        if: success() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: marsx-finance-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
