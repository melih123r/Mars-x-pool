name: Finance Full Market Universe Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/app/src/main/java/com/marsx/pool/FinanceActivity.java'
      - 'scripts/market_universe_validation.py'
      - '.github/workflows/finance-full-universe.yml'
jobs:
  full-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all Android symbols against live market APIs
        run: python scripts/market_universe_validation.py
      - name: Upload detailed PASS FAIL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-full-market-universe-report
          path: reports/market-universe-validation.md
          if-no-files-found: warn
