name: Command Center read-only verification
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read GitHub status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 command-center/github_status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-center-status
          path: marsx-ci-status.json
          retention-days: 7
