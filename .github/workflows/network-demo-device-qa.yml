name: Network DEMO Android 8 device QA
on:
  pull_request:
    paths:
      - '.github/workflows/network-demo-device-qa.yml'
      - 'scripts/network-demo-device-qa.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    if: github.head_ref == 'release/network-demo-signed-aab-20261022' || github.ref_name == 'release/network-demo-signed-aab-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build unchanged version 18 Android sources
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          gradle -p android :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 8 installation, locales, consent and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/network-demo-device-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-demo-v18-api26-device-qa
          path: device-qa/
          if-no-files-found: error
