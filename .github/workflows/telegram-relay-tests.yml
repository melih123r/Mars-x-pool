name: Telegram Relay Tests
on:
  push:
    paths:
      - 'telegram-relay/**'
      - '.github/workflows/telegram-relay-tests.yml'
  pull_request:
    paths:
      - 'telegram-relay/**'
      - '.github/workflows/telegram-relay-tests.yml'
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: node --check telegram-relay/server.mjs
      - name: Run relay regression tests
        run: node --test telegram-relay/intake.test.mjs telegram-relay/webhook.integration.test.mjs telegram-relay/lane-planner.test.mjs telegram-relay/ten-lane-planner.test.mjs telegram-relay/task-state.test.mjs telegram-relay/task-queue.test.mjs telegram-relay/durable-queue-contract.test.mjs telegram-relay/message-crypto.test.mjs telegram-relay/postgres-task-queue.test.mjs telegram-relay/outbox-delivery.test.mjs telegram-relay/outbox-flush.test.mjs telegram-relay/unconfigured-worker.test.mjs
