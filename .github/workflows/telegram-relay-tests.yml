name: Telegram Relay Tests
on:
  push:
    paths:
      - 'telegram-relay/**'
      - '.github/workflows/telegram-relay-tests.yml'
  pull_request:
    paths:
      - 'telegram-relay/**'
      - '.github/workflows/telegram-relay-tests.yml'
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check telegram-relay/server.mjs
      - name: Run relay regression tests
        run: node --test telegram-relay/intake.test.mjs
