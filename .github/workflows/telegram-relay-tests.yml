name: Telegram Relay Tests
on:
  push:
    paths:
      - 'telegram-relay/**'
      - '.github/workflows/telegram-relay-tests.yml'
  pull_request:
    paths:
      - 'telegram-relay/**'
      - '.github/workflows/telegram-relay-tests.yml'
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: telegram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: node --check telegram-relay/server.mjs && node --check telegram-relay/gemini-client.mjs
      - name: Run relay regression tests
        run: node --test telegram-relay/intake.test.mjs telegram-relay/webhook.integration.test.mjs telegram-relay/gemini-client.test.mjs telegram-relay/command-inbox.test.mjs telegram-relay/lane-planner.test.mjs telegram-relay/ten-lane-planner.test.mjs telegram-relay/task-state.test.mjs telegram-relay/task-queue.test.mjs telegram-relay/durable-queue-contract.test.mjs telegram-relay/message-crypto.test.mjs telegram-relay/postgres-task-queue.test.mjs telegram-relay/outbox-delivery.test.mjs telegram-relay/outbox-flush.test.mjs telegram-relay/unconfigured-worker.test.mjs
      - name: Verify isolated database bootstrap and concurrent intake
        env:
          MARSX_TEST_DATABASE_URL: postgres://postgres:disposable_ci_password@127.0.0.1:5432/telegram_test
        run: node --test telegram-relay/bootstrap-private-db.test.mjs
