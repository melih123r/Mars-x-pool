name: Proxy-first Android prototype
on:
  pull_request:
    paths:
      - "proxy-first-android/**"
      - ".github/workflows/proxy-first-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-first-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use runner Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Install Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Confirm no hardcoded farmer key or automatic SDK startup
        run: |
          ! grep -R -E 'psx_[A-Za-z0-9]{12,}|ProxiesPeerSDK\.start\(|ProxiesPeerSDK\.init\(' app/src/main
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect SDK resolution and merged manifest
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > /tmp/proxy-deps.txt
          grep -F 'android-peer-sdk:1.3.2' /tmp/proxy-deps.txt
          find app/build/intermediates -path '*/merged_manifests/*/AndroidManifest.xml' -type f -exec grep -o 'android.permission.[A-Z_]*' {} \; | sort -u || true
      - name: Inspect vendor SDK public API
        run: |
          python3 - <<'PY'
          import glob, zipfile, os
          base=os.path.expanduser('~/.gradle/caches/modules-2/files-2.1/com.github.bolivian-peru/android-peer-sdk')
          paths=glob.glob(base+'/**/*.aar',recursive=True)
          print('SDK AAR count:',len(paths))
          for path in paths:
              with zipfile.ZipFile(path) as archive:
                  if 'classes.jar' in archive.namelist():
                      with open('/tmp/proxies-sdk-classes.jar','wb') as output:
                          output.write(archive.read('classes.jar'))
          PY
          if [ -f /tmp/proxies-sdk-classes.jar ]; then
            jar tf /tmp/proxies-sdk-classes.jar | grep -E 'ProxiesPeerSDK|PeerConfig' || true
            jar tf /tmp/proxies-sdk-classes.jar | grep -E '(ProxiesPeerSDK|PeerConfig)\.class$' | sed 's@/@.@g;s@.class$@@' > /tmp/proxy-classes.txt
            while IFS= read -r cls; do
              javap -classpath /tmp/proxies-sdk-classes.jar -public "$cls" || true
            done < /tmp/proxy-classes.txt
          fi
      - name: Upload debug prototype
        uses: actions/upload-artifact@v4
        with:
          name: proxy-first-prototype-debug
          path: proxy-first-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
