name: Proxy-first Android prototype
on:
  pull_request:
    paths:
      - "proxy-first-android/**"
      - ".github/workflows/proxy-first-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-first-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use runner Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Confirm no proxy traffic capability or embedded key
        run: |
          ! grep -R -E 'android.permission.INTERNET|android-peer-sdk|psx_[A-Za-z0-9]+' app/src app/build.gradle
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug prototype
        uses: actions/upload-artifact@v4
        with:
          name: proxy-first-prototype-debug
          path: proxy-first-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
