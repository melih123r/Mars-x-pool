name: Proxy-first Android prototype
on:
  pull_request:
    paths:
      - "proxy-first-android/**"
      - ".github/workflows/proxy-first-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-first-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use runner Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Install Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Confirm no hardcoded farmer key or automatic SDK startup
        run: |
          ! grep -R -E 'psx_[A-Za-z0-9]{12,}|ProxiesPeerSDK\\.start\\(|ProxiesPeerSDK\\.init\\(' app/src/main
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect merged permissions and SDK resolution
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > /tmp/proxy-deps.txt
          grep -F 'android-peer-sdk:1.3.2' /tmp/proxy-deps.txt
          MANIFEST="$(find app/build/intermediates -path '*/merged_manifests/*/AndroidManifest.xml' -type f | head -n 1)"
          if [ -n "$MANIFEST" ]; then
            echo "Merged manifest permissions:"
            grep -o 'android.permission.[A-Z_]*' "$MANIFEST" | sort -u || true
          fi
      - name: Inspect vendor SDK public API
        run: |
          echo "Vendor SDK artifact files:"
          find "$HOME/.gradle/caches/modules-2/files-2.1/com.github.bolivian-peru/android-peer-sdk" -type f \\( -name '*.aar' -o -name '*.jar' \\) -print || true
          python3 - <<'PY'
          import glob, zipfile, os
          paths=glob.glob(os.path.expanduser('~/.gradle/caches/modules-2/files-2.1/com.github.bolivian-peru/android-peer-sdk/**/*.aar'),recursive=True)
          if not paths:
              print('No AAR found; inspect resolved SDK artifact format.')
          for path in paths:
              with zipfile.ZipFile(path) as archive:
                  if 'classes.jar' in archive.namelist():
                      with open('/tmp/proxies-sdk-classes.jar','wb') as f:
                          f.write(archive.read('classes.jar'))
          PY
          if [ -f /tmp/proxies-sdk-classes.jar ]; then
            jar tf /tmp/proxies-sdk-classes.jar | grep -E 'ProxiesPeerSDK|PeerConfig' || true
            for cls in $(jar tf /tmp/proxies-sdk-classes.jar | grep -E '(ProxiesPeerSDK|PeerConfig)\\.class        uses: actions/upload-artifact@v4
        with:
          name: proxy-first-prototype-debug
          path: proxy-first-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 | sed 's@/@.@g;s@.class$@@'); do
              javap -classpath /tmp/proxies-sdk-classes.jar -public "$cls" || true
            done
          fi
      - name: Upload debug prototype
        uses: actions/upload-artifact@v4
        with:
          name: proxy-first-prototype-debug
          path: proxy-first-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
