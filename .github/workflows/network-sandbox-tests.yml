name: Network sandbox JVM tests
on:
  pull_request:
    paths:
      - 'network-sandbox/**'
      - '.github/workflows/network-sandbox-tests.yml'
  push:
    branches:
      - 'feature/network-consent-simulator-20261015'
    paths:
      - 'network-sandbox/**'
      - '.github/workflows/network-sandbox-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: network-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle test --no-daemon --stacktrace
