name: Network sandbox JVM tests
on:
  pull_request:
    paths:
      - 'network-sandbox/**'
      - '.github/workflows/network-sandbox-tests.yml'
  push:
    branches:
      - 'feature/network-consent-simulator-20261015'
    paths:
      - 'network-sandbox/**'
      - '.github/workflows/network-sandbox-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: network_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests
        working-directory: network-sandbox
        run: gradle test --no-daemon --stacktrace
      - name: Mock ledger and PostgreSQL upgrade contracts
        env:
          MARSX_NETWORK_TEST_DATABASE_URL: postgres://postgres:disposable_ci_password@127.0.0.1:5432/network_test
        run: node --test network-sandbox/ledger-contract.test.mjs network-sandbox/migration-integration.test.mjs
