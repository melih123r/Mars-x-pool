name: Global Engine CI
on:
  pull_request:
    paths:
      - "global-engine/**"
      - "test/global-engine*.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/global-engine-ci.yml"
      - "scripts/changenow-readonly-smoke.mjs"
  push:
    branches: ["marsx-global-engine-v01"]
    paths:
      - "global-engine/**"
      - "test/global-engine*.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/global-engine-ci.yml"
      - "scripts/changenow-readonly-smoke.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run global-engine:test
      - name: ChangeNOW read-only smoke test (live, no transaction)
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          MARSX_BASE_URL: https://marsx-global-engine.onrender.com
        run: node scripts/changenow-readonly-smoke.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development dependencies (report, no unsafe auto-fix)
        if: always()
        run: |
          npm audit --include=dev --audit-level=high --json > npm-audit-full.json || true
          node -e 'const a=require("./npm-audit-full.json"); const v=a.vulnerabilities||{}; for(const [name,x] of Object.entries(v)) if(["high","critical"].includes(x.severity)) console.log(`${name}: ${x.severity}; direct=${x.isDirect}; fixAvailable=${JSON.stringify(x.fixAvailable)}`); console.log("full-audit",JSON.stringify(a.metadata?.vulnerabilities||{}))'
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          retention-days: 7
