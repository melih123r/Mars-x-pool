name: Android ARM64 engine build evidence
on:
  workflow_dispatch:
  push:
    branches: [feature/vrsc-native-integration]
    paths:
      - mobile-miner/native/**
      - .github/workflows/vrsc-android-native.yml
permissions:
  contents: read
jobs:
  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test controller safety and loopback lifecycle
        run: |
          mkdir -p mobile-miner/android/build/tests
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o mobile-miner/android/build/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  mobile-miner/android/build/json.jar' | sha256sum -c -
          javac -cp mobile-miner/android/build/json.jar -d mobile-miner/android/build/tests \
            mobile-miner/android/src/com/marsx/mobileminer/VrscConfig.java \
            mobile-miner/android/src/com/marsx/mobileminer/PoolShareObserver.java \
            mobile-miner/android/src/com/marsx/mobileminer/VerifiedTlsRelay.java \
            mobile-miner/android/src/com/marsx/mobileminer/NativeEngineSession.java \
            mobile-miner/android/NativeLifecycleTest.java \
            mobile-miner/android/PoolShareObserverTest.java
          java -cp mobile-miner/android/build/tests:mobile-miner/android/build/json.jar NativeLifecycleTest
          java -cp mobile-miner/android/build/tests:mobile-miner/android/build/json.jar PoolShareObserverTest
      - name: Build connection diagnostic APK
        run: MINER_ANDROID_SDK="$ANDROID_HOME" bash mobile-miner/android/build-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vrsc-connection-diagnostic-apk
          path: mobile-miner/android/build/MARS-X-Miner-Device-Test.apk
          retention-days: 7
  android-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y automake autoconf libtool pkg-config perl
      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
      - name: Cross compile Android Bionic engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash mobile-miner/native/build-android.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vrsc-android-arm64-engine
          path: mobile-miner/native/build/artifact/
          retention-days: 7
