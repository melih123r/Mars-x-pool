name: Security dependency lock refresh
on:
  push:
    branches: [security/wrangler-audit-fix]
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - run: npm ci
      - run: npm run global-engine:test
      - run: npm audit --audit-level=high
      - name: Commit lockfile only after validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || (git commit -m 'fix(security): refresh wrangler dependency lockfile' && git push)
