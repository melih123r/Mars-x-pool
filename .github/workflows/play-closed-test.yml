name: Google Play closed-test release

# Manual by design. The default path builds a signed AAB for owner upload.
on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload the signed AAB to the Play closed-test track
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: google-play-closed-test
  cancel-in-progress: false

jobs:
  verify-build-upload:
    runs-on: ubuntu-latest
    environment: google-play-closed-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 scripts/check-translations.py
      - run: python3 scripts/check-release.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          for value in "$KEYSTORE_B64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$GOOGLE_WEB_CLIENT_ID"; do
            if [ -z "$value" ]; then echo "Missing signing credential"; exit 1; fi
          done
          case "$GOOGLE_WEB_CLIENT_ID" in
            *-*.apps.googleusercontent.com) ;;
            *) echo "Invalid Google Web OAuth client ID"; exit 1 ;;
          esac
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload-keystore.jks"
      - name: Require Play credential when publishing
        if: ${{ inputs.publish_to_play }}
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "Missing Play service-account credential"; exit 1; fi
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/google-play.json"
          chmod 600 "$RUNNER_TEMP/google-play.json"
      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QONVERSION_PROJECT_KEY: ${{ secrets.QONVERSION_PROJECT_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          gradle -p android :app:lintRelease :app:bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-pool-signed-closed-test-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Upload to Google Play closed testing
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play.json
          packageName: com.marsx.finance
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
